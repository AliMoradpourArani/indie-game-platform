services:
  db:
    image: postgres:16-alpine
    container_name: indie-game-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: indie
      POSTGRES_PASSWORD: indie_dev_password
      POSTGRES_DB: indie_game_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indie -d indie_game_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
